# Phase 1: PostgreSQL 16 is required.
# `docker compose up db` is enough when api/ and web/ run on the host.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ash}
      POSTGRES_DB: ${POSTGRES_DB:-ash_cedar}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - ash_cedar_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ash} -d ${POSTGRES_DB:-ash_cedar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ash}:${POSTGRES_PASSWORD:-ash}@db:5432/${POSTGRES_DB:-ash_cedar}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-key-32}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      COOKIE_SECURE: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin-password}
      ADMIN_NAME: ${ADMIN_NAME:-Store Admin}
      ADMIN_DATE_OF_BIRTH: ${ADMIN_DATE_OF_BIRTH:-1990-01-01}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./web
      args:
        API_ORIGIN: http://api:8000
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ash_cedar_pg:
